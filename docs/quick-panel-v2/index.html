<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>游戏模式快设面板</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#0F0F10; --fg:#F2F2F2; --fg2:rgba(242,242,242,.6); --fg3:rgba(242,242,242,.32);
  --chip:rgba(255,255,255,.1); --chip2:rgba(255,255,255,.18); --red:#FF5A4E;
  --sans:"SF Pro Display","SF Pro Text","PingFang SC","Noto Sans SC",system-ui,sans-serif;
  --quart:cubic-bezier(.165,.84,.44,1);
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:#050505;color:var(--fg);overflow:hidden;font-family:var(--sans)}
#vp{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1920px;height:1200px;position:relative;overflow:hidden;background:#000;flex:none;transform-origin:center;user-select:none;-webkit-user-select:none;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
svg{display:block}
#game{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* One column from the left edge. The game keeps running and stays in focus underneath; nothing outside the panel is dimmed. */
#qs{position:absolute;left:0;top:0;bottom:0;width:600px;box-sizing:border-box;padding:36px 40px 40px;background:rgba(15,15,16,.96);
  box-shadow:24px 0 60px rgba(0,0,0,.45);transform:translateX(-100%);transition:transform .3s var(--quart);display:flex;flex-direction:column}
#qs.on{transform:none}

.top{display:flex;justify-content:space-between;align-items:center;height:40px;font-size:26px;font-variant-numeric:tabular-nums}
.top .r{display:flex;align-items:center;gap:10px}
.top .r em{font-style:normal;color:var(--fg2);margin-left:6px}
/* the in-game OSD hides while the panel is open, so the three numbers that answer "is it working" sit at the top */
.read{display:flex;gap:34px;margin:26px 0 30px;font-size:24px;color:var(--fg2);font-variant-numeric:tabular-nums}
.read b{color:var(--fg);font-weight:600;font-size:30px;margin-right:6px}

.grp{margin-top:30px}
.grp:first-of-type{margin-top:0}
/* value row: up/down picks it, left/right changes it at once */
.row{display:flex;align-items:center;gap:18px;height:84px;margin:0 -14px;padding:0 14px;border-radius:18px;box-shadow:inset 0 0 0 3px transparent;transition:box-shadow .12s}
.row.fo{box-shadow:inset 0 0 0 3px #fff}
.row .k{width:104px;flex:none;font-size:26px}
.row .v{flex:none;width:86px;text-align:right;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.trk{position:relative;flex:1;height:8px;border-radius:4px;background:var(--chip2)}
.trk i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:#F2F2F2;transition:width .12s}
.trk em{position:absolute;top:50%;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:14px;background:#F2F2F2;box-shadow:0 2px 8px rgba(0,0,0,.5);transition:left .12s}
.trk u{position:absolute;top:16px;width:2px;height:8px;margin-left:-1px;background:var(--fg3)}
.trk.mute i,.trk.mute em{background:rgba(242,242,242,.4)}
.seg{flex:1;display:flex;height:52px;border-radius:14px;background:var(--chip);padding:4px;box-sizing:border-box;position:relative}
.seg b{position:absolute;top:4px;bottom:4px;border-radius:10px;background:#F2F2F2;transition:left .2s var(--quart),width .2s var(--quart)}
.seg span{flex:1;position:relative;z-index:1;display:flex;align-items:center;justify-content:center;font-size:23px;color:var(--fg2);font-variant-numeric:tabular-nums;transition:color .2s}
.seg span.on{color:#111;font-weight:600}

/* switches and actions: left/right walks the buttons, A acts */
.btns{display:grid;gap:10px;margin:0 -14px;padding:10px 14px;border-radius:18px}
.btns.c4{grid-template-columns:repeat(4,1fr)}
.btns.c3{grid-template-columns:repeat(3,1fr)}
.b{height:116px;border-radius:18px;background:var(--chip);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:21px;transition:background .15s,color .15s}
.b.on{background:#F2F2F2;color:#111}
.b.cur{box-shadow:0 0 0 3px #fff}
.b.on.cur{box-shadow:0 0 0 3px #fff,inset 0 0 0 3px #111}
.b.act{height:84px;flex-direction:row;gap:12px;font-size:23px}

.bot{margin-top:auto;display:flex;gap:10px}
.bot button{height:72px;border-radius:20px;background:var(--chip);display:flex;align-items:center;justify-content:center;gap:12px;font-size:24px;transition:background .18s,color .18s}
.bot .w{flex:1}.bot .i{width:72px;flex:none}
.bot button.cur{box-shadow:0 0 0 3px #fff inset}
.bot button.warn{background:var(--red);color:#fff;font-weight:600}

#osd{position:absolute;right:28px;top:24px;padding:10px 16px;border-radius:12px;background:rgba(0,0,0,.45);font-size:20px;font-variant-numeric:tabular-nums;display:flex;gap:16px;transition:opacity .2s}
#qs.on~#osd{opacity:0}
#toast{position:absolute;left:640px;bottom:48px;padding:14px 22px;border-radius:16px;background:rgba(15,15,16,.9);font-size:22px;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none}
#toast.on{opacity:1;transform:none}
#tgl{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:8px 16px;border-radius:999px;background:rgba(30,30,32,.92);border:1px solid rgba(255,255,255,.1);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="vp"><div id="stage">
  <img id="game" src="game.jpg" alt="">
  <aside id="qs" class="on" aria-label="快设面板"></aside>
  <div id="osd"><span id="o1">58 fps</span><span id="o2">17.2 W</span><span id="o3">71°</span></div>
  <div id="toast"></div>
</div></div>
<button id="tgl">开关面板</button>

<script>
const IC={
 osd:'<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M6.5 8.5h5M6.5 11.5h3.5"/></svg>',
 scale:'<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 15v5h-5M4 4l6 6M20 20l-6-6"/></svg>',
 fg:'<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="6" width="11" height="12" rx="2"/><path d="M17 8.5h2.5a1.5 1.5 0 0 1 1.5 1.5v4a1.5 1.5 0 0 1-1.5 1.5H17"/></svg>',
 mouse:'<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><rect x="6.5" y="3" width="11" height="18" rx="5.5"/><path d="M12 7v3"/></svg>',
 shot:'<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.8l1.4-2h4.6l1.4 2h1.8A2.5 2.5 0 0 1 20 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5z"/><circle cx="12" cy="12.5" r="3.3"/></svg>',
 kb:'<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6 9.5h.01M9 9.5h.01M12 9.5h.01M15 9.5h.01M18 9.5h.01M7.5 14.5h9"/></svg>',
 win:'<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="5" width="12" height="9" rx="2"/><path d="M9 17.5h9.5A2.5 2.5 0 0 0 21 15V9"/></svg>',
 lib:'<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></svg>',
 exit:'<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4.5H6.5A2 2 0 0 0 4.5 6.5v11a2 2 0 0 0 2 2H14M10 12h10M16.5 8.5 20 12l-3.5 3.5"/></svg>',
 moon:'<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M19.5 14.5A7.5 7.5 0 0 1 9.5 4.5a7.5 7.5 0 1 0 10 10z"/></svg>',
 bat:'<svg width="44" height="22" viewBox="0 0 48 26" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="1.2" y="1.2" width="40.6" height="23.6" rx="6"/><rect x="5" y="5" width="22" height="16" rx="2.6" fill="currentColor" stroke="none"/><path d="M45.5 9v8" stroke-linecap="round" stroke-width="3"/></svg>'
};
const FPS=["不限","30","40","45","60"],FAN=["静音","均衡","性能"],HZ=["60","90","120"];
const S={tdp:17,fps:0,fan:1,bri:62,hz:2,vol:40,mute:false,osd:true,mag:false,lsfg:false,mouse:false,open:true,r:0,c:0,exitArm:0};
/* rows top to bottom; "v" rows change with left/right, "b" rows are buttons */
const ROWS=[
 {k:"tdp",t:"v"},{k:"fps",t:"v"},{k:"fan",t:"v"},
 {k:"bri",t:"v"},{k:"hz",t:"v"},{k:"vol",t:"v"},
 {k:"tog",t:"b",n:4},{k:"act",t:"b",n:3},{k:"bot",t:"b",n:3}
];
const $=s=>document.querySelector(s),stage=$("#stage");
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1200);stage.style.transform=`scale(${s})`;stage._s=s}
addEventListener("resize",fit);fit();

const track=(k,v,min,max,ticks,cls="")=>{const p=(v-min)/(max-min)*100;
  return `<div class="trk ${cls}" data-sl="${k}" data-min="${min}" data-max="${max}"><i style="width:${p}%"></i>${(ticks||[]).map(t=>`<u style="left:${(t-min)/(max-min)*100}%"></u>`).join("")}<em style="left:${p}%"></em></div>`};
const seg=(k,opts,v)=>`<div class="seg" data-seg="${k}"><b style="left:calc(4px + (100% - 8px) * ${v}/${opts.length});width:calc((100% - 8px) / ${opts.length})"></b>${opts.map((o,i)=>`<span data-k="${k}" data-i="${i}" class="${i===v?"on":""}">${o}</span>`).join("")}</div>`;
function row(i,label,ctl,val){return `<div class="row${S.r===i?" fo":""}" data-r="${i}"><span class="k">${label}</span>${ctl}${val!=null?`<span class="v">${val}</span>`:""}</div>`}
const cur=(r,c)=>S.r===r&&S.c===c;

function paint(){
  const t=new Date(),hh=`${t.getHours()}:${String(t.getMinutes()).padStart(2,"0")}`;
  const togs=[["osd","性能显示","osd"],["mag","画面缩放","scale"],["lsfg","补帧","fg"],["mouse","鼠标模式","mouse"]];
  $("#qs").innerHTML=`
  <div class="top"><span>${hh}</span><span class="r">${IC.bat}66%<em>约 2:10</em></span></div>
  <div class="read"><span><b id="r1">58</b>fps</span><span><b id="r2">16.8</b>W</span><span><b id="r3">71</b>°C</span></div>
  <div class="grp">
    ${row(0,"功耗",track("tdp",S.tdp,8,35,[10,17,25]),S.tdp+" W")}
    ${row(1,"限帧",seg("fps",FPS,S.fps))}
    ${row(2,"风扇",seg("fan",FAN,S.fan))}
  </div>
  <div class="grp">
    ${row(3,"亮度",track("bri",S.bri,0,100),S.bri+"%")}
    ${row(4,"刷新率",seg("hz",HZ.map(h=>h+" Hz"),S.hz))}
    ${row(5,"音量",track("vol",S.vol,0,100,null,S.mute?"mute":""),S.mute?"静音":S.vol+"%")}
  </div>
  <div class="grp btns c4">${togs.map(([k,n,i],c)=>`<button class="b${S[k]?" on":""}${cur(6,c)?" cur":""}" data-r="6" data-c="${c}">${IC[i]}${n}</button>`).join("")}</div>
  <div class="btns c3" style="padding-top:0">${[["截图","shot"],["键盘","kb"],["窗口","win"]].map(([n,i],c)=>`<button class="b act${cur(7,c)?" cur":""}" data-r="7" data-c="${c}">${IC[i]}${n}</button>`).join("")}</div>
  <div class="bot">
    <button class="w${cur(8,0)?" cur":""}" data-r="8" data-c="0">${IC.lib}游戏库</button>
    <button class="w${cur(8,1)?" cur":""}${S.exitArm?" warn":""}" data-r="8" data-c="1">${IC.exit}${S.exitArm?"确认退出":"退出游戏"}</button>
    <button class="i${cur(8,2)?" cur":""}" data-r="8" data-c="2" aria-label="睡眠">${IC.moon}</button>
  </div>`;
}
let tt;function toast(s){const t=$("#toast");t.textContent=s;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),1400)}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function adjust(k,d){
  if(k==="tdp")S.tdp=clamp(S.tdp+d,8,35);
  else if(k==="fps")S.fps=clamp(S.fps+d,0,FPS.length-1);
  else if(k==="fan")S.fan=clamp(S.fan+d,0,FAN.length-1);
  else if(k==="bri")S.bri=clamp(S.bri+d*5,0,100);
  else if(k==="hz")S.hz=clamp(S.hz+d,0,HZ.length-1);
  else if(k==="vol"){S.mute=false;S.vol=clamp(S.vol+d*5,0,100)}
}
function move(dx,dy){
  if(!S.open)return;
  const R=ROWS[S.r];
  if(dx){if(R.t==="v")adjust(R.k,dx);else{S.c=clamp(S.c+dx,0,R.n-1)}if(S.r!==8||S.c!==1)S.exitArm=0}
  else{const was=S.r;S.r=clamp(S.r+dy,0,ROWS.length-1);const N=ROWS[S.r];
    if(N.t==="b"){const from=ROWS[was].t==="b"?ROWS[was].n:N.n;S.c=clamp(Math.round(S.c*(N.n-1)/Math.max(1,from-1)),0,N.n-1)}else S.c=0;
    S.exitArm=0}
  paint();
}
function press(){
  if(!S.open)return;const R=ROWS[S.r];
  if(R.k==="vol"){S.mute=!S.mute}
  else if(R.k==="tog"){const k=["osd","mag","lsfg","mouse"][S.c];S[k]=!S[k]}
  else if(R.k==="act"){toast(["已截图","键盘已打开","窗口切换"][S.c]);if(S.c)setOpen(false)}
  else if(R.k==="bot"){if(S.c===0){toast("返回游戏库");setOpen(false)}
    else if(S.c===1){if(S.exitArm){S.exitArm=0;toast("已退出游戏");setOpen(false)}else{S.exitArm=1;setTimeout(()=>{if(S.exitArm){S.exitArm=0;paint()}},3000)}}
    else{toast("睡眠");setOpen(false)}}
  paint();
}
function back(){if(S.exitArm){S.exitArm=0;paint();return}setOpen(false)}
function setOpen(o){S.open=o;$("#qs").classList.toggle("on",o);S.exitArm=0;paint()}

setInterval(()=>{const cap=S.fps?+FPS[S.fps]:0,f=cap?cap-Math.round(Math.random()):Math.min(S.tdp*3.6,56+Math.round(Math.random()*6))|0,w=(S.tdp*(.92+Math.random()*.08)).toFixed(1),c=60+Math.round(S.tdp/2.2-S.fan*2+Math.random()*2);
  const a=$("#r1");if(a){a.textContent=f;$("#r2").textContent=w;$("#r3").textContent=c}
  $("#o1").textContent=f+" fps";$("#o2").textContent=w+" W";$("#o3").textContent=c+"°"},1000);

addEventListener("keydown",e=>{const k=e.key;let h=true;
  if(k==="q"||k==="Q")setOpen(!S.open);else if(!S.open)h=false;
  else if(k==="ArrowLeft")move(-1,0);else if(k==="ArrowRight")move(1,0);else if(k==="ArrowUp")move(0,-1);else if(k==="ArrowDown")move(0,1);
  else if(k==="Enter"||k===" ")press();else if(k==="Escape"||k==="Backspace")back();else h=false;
  if(h)e.preventDefault()});
$("#tgl").addEventListener("click",()=>setOpen(!S.open));
/* touch: tap a segment or button, drag a track, tap the game to close */
stage.addEventListener("click",e=>{if(!S.open)return;
  if(!e.target.closest("#qs")){setOpen(false);return}
  const sp=e.target.closest("[data-seg] span");if(sp){const k=sp.dataset.k,i=+sp.dataset.i;S[k]=i;S.r=ROWS.findIndex(r=>r.k===k);paint();return}
  const b=e.target.closest("button[data-r]");if(b){S.r=+b.dataset.r;S.c=+b.dataset.c;press();return}
  const r=e.target.closest(".row");if(r){S.r=+r.dataset.r;paint()}});
let drag=null;
stage.addEventListener("pointerdown",e=>{const t=e.target.closest("[data-sl]");if(!t)return;drag=t.dataset.sl;setSl(e)});
addEventListener("pointermove",e=>{if(drag)setSl(e)});addEventListener("pointerup",()=>drag=null);
function setSl(e){const t=document.querySelector(`[data-sl="${drag}"]`);if(!t)return;const r=t.getBoundingClientRect(),min=+t.dataset.min,max=+t.dataset.max;
  const v=Math.round(min+clamp((e.clientX-r.left)/r.width,0,1)*(max-min));S[drag]=v;if(drag==="vol")S.mute=false;S.r=ROWS.findIndex(x=>x.k===drag);paint()}
const pad={h:{},n:{}};
function poll(t){const gp=(navigator.getGamepads?[...navigator.getGamepads()]:[]).find(Boolean);
  if(gp){const ax=gp.axes||[],b=i=>gp.buttons[i]&&gp.buttons[i].pressed;
    const st={L:b(14)||ax[0]<-.5,R:b(15)||ax[0]>.5,U:b(12)||ax[1]<-.5,D:b(13)||ax[1]>.5,A:b(0),B:b(1),M:b(9)};
    for(const[k,v]of Object.entries(st)){if(v){const rep="LRUD".includes(k);if(!pad.h[k]||(rep&&t>pad.n[k])){pad.n[k]=t+(pad.h[k]?100:340);pad.h[k]=true;
      ({L:()=>move(-1,0),R:()=>move(1,0),U:()=>move(0,-1),D:()=>move(0,1),A:press,B:back,M:()=>setOpen(!S.open)})[k]()}}else pad.h[k]=false}}
  requestAnimationFrame(poll)}
requestAnimationFrame(poll);
paint();
</script>
</body>
</html>
