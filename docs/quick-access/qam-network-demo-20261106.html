<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>快捷面板 · Wi-Fi / 蓝牙列表 demo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090B;--ink:#F4F4F5;--ink2:rgba(244,244,245,.55);--ink3:rgba(244,244,245,.25);--off:rgba(244,244,245,.08);--line:rgba(244,244,245,.10);--acc:#F4E04D;--red:#FF5A4E;
--ease:cubic-bezier(.22,1,.36,1);--f:"SF Pro Text","PingFang SC",Inter,"Noto Sans SC",system-ui,sans-serif;--num:"SF Pro Display",Inter,var(--f)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:var(--ink);font-family:var(--f);overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#bar{display:flex;gap:8px}
#bar button{font:600 13px var(--f);color:var(--ink2);background:#18181b;border:0;border-radius:10px;padding:8px 14px;cursor:pointer}
#bar button.sel{color:var(--bg);background:var(--ink)}
#dev{width:1280px;height:800px;position:relative;overflow:hidden;border-radius:6px;transform-origin:center;flex:none}
#game{position:absolute;inset:0}#game svg,.frz svg{width:100%;height:100%;display:block}
#scrim{position:absolute;inset:0}
#panel{position:absolute;left:0;top:0;bottom:0;width:416px;will-change:transform}
#glass{position:absolute;inset:0;overflow:hidden;border-right:1px solid var(--line)}
.frz{position:absolute;top:0;left:0;width:1280px;height:800px;filter:blur(24px) brightness(.82) saturate(1.15);transform-origin:0 0}
#glass .tint{position:absolute;inset:0;background:rgba(9,9,11,.36)}
#c{position:absolute;inset:0;padding:24px 32px;display:flex;flex-direction:column}
/* 状态栏 */
.stat{height:36px;display:flex;align-items:center;justify-content:space-between;font:600 17px var(--f);font-variant-numeric:tabular-nums}
.stat .r{display:flex;align-items:center;gap:8px}.stat .sub{font-weight:400;color:var(--ink2)}
.bat{width:24px;height:12px;border:1.5px solid var(--ink);border-radius:3.5px;position:relative;padding:1.5px}
.bat:after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:4px;border-radius:0 1px 1px 0;background:var(--ink)}
.bat i{display:block;height:100%;background:var(--ink);border-radius:1.5px}
/* 焦点光标：一块，在行之间用弹簧移动 */
#cur{position:absolute;left:20px;right:20px;border-radius:16px;box-shadow:0 0 0 3px var(--ink),0 0 14px 3px rgba(244,244,245,.14);pointer-events:none;opacity:0;transition:opacity .16s}
#cur.on{opacity:1}
/* 三个主调节：大数字 */
.big{position:relative;height:84px;padding:12px 0 0;cursor:pointer;touch-action:none}
.big .hd{display:flex;align-items:baseline;justify-content:space-between}
.big .lb{font:600 15px var(--f);color:var(--ink2);display:flex;align-items:center;gap:8px}
.big .lb svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.big .v{font:700 40px var(--num);letter-spacing:-.5px;line-height:40px;font-variant-numeric:tabular-nums}
.big .v small{font:600 17px var(--f);color:var(--ink2);margin-left:4px;letter-spacing:0}
.big .tr{position:absolute;left:0;right:0;bottom:12px;height:3px;border-radius:2px;background:rgba(244,244,245,.22)}
.big .fl{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--ink)}
.big .tk{position:absolute;top:-3px;width:2px;height:9px;margin-left:-1px;border-radius:1px;background:rgba(244,244,245,.35)}
.big .tk.p{background:var(--ink)}
.big .sub{position:absolute;left:26px;top:54px;font:400 13px var(--f);color:var(--ink2);font-variant-numeric:tabular-nums}
.big .sub b{font-weight:600;color:var(--ink)}
.big.muted .v,.big.muted .fl{opacity:.3}
.pair{display:flex;gap:24px;height:44px;align-items:center}
.mini{flex:1;display:flex;align-items:center;gap:10px;cursor:pointer;touch-action:none;height:44px}
.mini svg{width:20px;height:20px;flex:none;fill:none;stroke:var(--ink2);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s}
.mini .tr{flex:1;height:3px;border-radius:2px;background:rgba(244,244,245,.22);position:relative}
.mini .fl{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:rgba(244,244,245,.7);transition:background .2s}
.mini .n{width:30px;text-align:right;font:600 15px var(--num);font-variant-numeric:tabular-nums;color:var(--ink2);transition:color .2s}
.mini.hot svg{stroke:var(--ink)}.mini.hot .fl{background:var(--ink)}.mini.hot .n{color:var(--ink)}
.mini .n.pop{animation:pop .32s var(--ease)}
@keyframes pop{0%{transform:scale(1.22)}100%{transform:none}}
.mini.muted .fl,.mini.muted .n{opacity:.3}
.grp{height:24px;flex:none}.grp.s{height:16px}
.big[data-f="pw"]{height:100px}
/* 选项行 */
.row{height:48px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font:400 15px var(--f)}
.row .nm{color:var(--ink)}
.row .val{display:flex;align-items:center;gap:10px;font-weight:600;font-variant-numeric:tabular-nums}
.row .ch{width:16px;height:16px;fill:none;stroke:var(--ink2);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .16s,transform .24s var(--ease)}
.row.f .ch{opacity:1}
.row .ch.l.k{transform:translateX(-4px)}.row .ch.r.k{transform:translateX(4px)}
.row .vt{text-align:right;display:inline-block}
.row .vt.off{color:var(--ink2);font-weight:400}
.row .lamp{width:6px;height:6px;border-radius:2px;background:var(--acc);margin-right:-2px;opacity:0;transform:scale(.4);transition:opacity .2s,transform .3s var(--ease)}
.row .lamp.on{opacity:1;transform:none}
.row.dis{opacity:.25;pointer-events:none}
/* 底部：控制中心式网格（5 列 × 3 行，格 62.4，间距 10） */
.cc{margin-top:auto;position:relative;height:207px;flex:none}
.ct .tx2{font:700 13px var(--num);letter-spacing:.5px}
.ct.card{justify-content:flex-start;padding:0 12px;gap:12px}
.ct.card .cg{width:38px;height:38px;border-radius:13px;background:rgba(244,244,245,.10);display:grid;place-items:center;flex:none;transition:background .2s}
.ct.card .cg svg{width:20px;height:20px}
.ct.card .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.ct.card .tn{font:600 15px var(--f);white-space:nowrap}
.ct.card .sb{font:400 12px var(--f);color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
.ct.card.arm .sb{color:rgba(9,9,11,.7)}.ct.card.arm .cg{background:rgba(9,9,11,.14)}
.ct{position:absolute;width:62.4px;height:62.4px;border-radius:20px;background:var(--off);display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;color:var(--ink);font:600 15px var(--f);
 transition:background .2s,color .2s,outline-color .16s,opacity .2s,transform .36s var(--ease);outline:3px solid transparent;outline-offset:3px}
.ct svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ct.in{background:rgba(244,244,245,.10);border-radius:17px;transform:scale(.82)}
.ct.on{background:rgba(244,244,245,.92);color:var(--bg)}
.ct.f{outline-color:var(--ink);box-shadow:0 0 16px 6px rgba(244,244,245,.12)}
.ct.arm{background:var(--red);color:var(--bg)}
.ct.dis{opacity:.25;pointer-events:none}
.ct.pr{transform:scale(.92);transition:transform .08s}.ct.in.pr{transform:scale(.76)}
.ct.pmi{opacity:0;transform:translateY(10px);pointer-events:none}
.cc.pm .ct.r2x{opacity:0;transform:translateY(-10px);pointer-events:none}.cc.pm .ct.pmi{opacity:1;transform:none;pointer-events:auto}
.ct .tip{position:absolute;bottom:74px;left:50%;transform:translate(-50%,6px);white-space:nowrap;font:600 13px var(--f);background:rgba(9,9,11,.9);color:var(--ink);padding:7px 11px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .16s,transform .24s var(--ease);z-index:3}
.ct.f .tip:not(:empty),.ct.arm .tip:not(:empty){opacity:1;transform:translate(-50%,0)}
.ct.arm .tip{background:var(--red);color:var(--bg)}
.ct[data-c="4"] .tip{left:auto;right:0;transform:translate(0,6px)}.ct[data-c="4"].f .tip,.ct[data-c="4"].arm .tip{transform:none}
.ct[data-c="0"] .tip{left:0;transform:translate(0,6px)}.ct[data-c="0"].f .tip,.ct[data-c="0"].arm .tip{transform:none}
/* 动作：图标 */
.acts{display:flex;justify-content:space-between;margin-top:auto}
.ic{width:52px;height:52px;border-radius:18px;background:var(--off);display:grid;place-items:center;position:relative;cursor:pointer;transition:background .18s,color .18s,box-shadow .18s,opacity .2s;color:var(--ink)}
.ic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ic.f{background:var(--ink);color:var(--bg);box-shadow:0 0 0 4px rgba(244,244,245,.14)}
.ic.arm{background:var(--red);color:var(--bg);box-shadow:0 0 0 4px rgba(255,90,78,.22)}
.ic.dis{opacity:.25;pointer-events:none}
.tip{position:absolute;bottom:64px;left:50%;transform:translate(-50%,6px);white-space:nowrap;font:600 13px var(--f);background:rgba(9,9,11,.9);color:var(--ink);padding:7px 11px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .16s,transform .24s var(--ease)}
.ic.f .tip,.ic.arm .tip,.btn.f .tip,.btn.arm .tip{opacity:1;transform:translate(-50%,0)}
.ic.arm .tip{background:var(--red);color:var(--bg)}
.acts .ic:first-child .tip{left:0;transform:translate(0,6px)}.acts .ic:first-child.f .tip,.acts .ic:first-child.arm .tip{transform:none}
.acts .ic:last-child .tip{left:auto;right:0;transform:translate(0,6px)}.acts .ic:last-child.f .tip,.acts .ic:last-child.arm .tip{transform:none}
/* 离开：一行两块 */
.leave{display:flex;gap:10px;margin-top:12px}
.btn{position:relative;flex:1;height:52px;border-radius:18px;background:var(--off);display:flex;align-items:center;justify-content:center;font:600 15px var(--f);cursor:pointer;transition:background .18s,color .18s,box-shadow .18s}
.btn.f{background:var(--ink);color:var(--bg);box-shadow:0 0 0 4px rgba(244,244,245,.14)}
.btn.arm{background:var(--red);color:var(--bg);box-shadow:0 0 0 4px rgba(255,90,78,.22)}
.btn .tip{background:var(--red);color:var(--bg)}
.leave .btn:last-child .tip{left:auto;right:0;transform:translate(0,6px)}.leave .btn:last-child.arm .tip{transform:none}
.btn.f .tip{display:none}.btn.arm .tip{display:block}
.btn.dis{opacity:.25;pointer-events:none}
#warnx{height:0;overflow:hidden;font:600 13px var(--f);color:var(--red);text-align:center;transition:height .24s var(--ease)}
#warn.on{height:26px;padding-top:8px}
#toast{position:absolute;left:848px;bottom:32px;transform:translate(-50%,8px);font:600 15px var(--f);background:rgba(9,9,11,.88);padding:10px 16px;border-radius:12px;opacity:0;transition:opacity .2s,transform .3s var(--ease);pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
#hud{position:absolute;left:20px;top:16px;font:600 13px Inter,var(--f);color:#c8ffd4;text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums}
</style></head><body>
<div id="wrap">
<div id="bar"><button id="bOpen" class="sel">面板 · Q</button><button id="bGame" class="sel">正在游戏</button><button id="bNo">没开游戏</button><span style="font:400 13px var(--f);color:rgba(244,244,245,.45);align-self:center;margin-left:8px">原型键位：LB / RB 或 [ ] 调亮度，LT / RT 或 - = 调音量</span></div>
<div id="dev">
 <div id="game"></div><div id="scrim"></div>
 <div id="panel"><div id="glass"><div class="frz" id="frz"></div><div class="tint"></div></div>
  <div id="cur"></div>
  <div id="c"></div>
 </div>
 <div id="toast"></div>
</div></div>
<script>
const P={bolt:"M13 3L5 13.5h6L10 21l8-10.5h-6z",sun:"M12 8.5a3.5 3.5 0 1 0 0 7a3.5 3.5 0 1 0 0-7z M12 3v1.5 M12 19.5V21 M3 12h1.5 M19.5 12H21 M5.6 5.6l1.1 1.1 M17.3 17.3l1.1 1.1 M5.6 18.4l1.1-1.1 M17.3 6.7l1.1-1.1",vol:"M4 10h3l5-4v12l-5-4H4z M16 9.5a3.5 3.5 0 0 1 0 5 M18.5 7a7 7 0 0 1 0 10",mute:"M4 10h3l5-4v12l-5-4H4z M16 9.5l5 5 M21 9.5l-5 5",shot:"M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8 M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8 M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16 M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16 M12 9.5a2.5 2.5 0 1 0 0 5a2.5 2.5 0 1 0 0-5z",win:"M4 9h11v11H4z M9 4h11v11",kbd:"M3 6.5h18v11H3z M7 10.5h.01 M11 10.5h.01 M15 10.5h.01 M8 14h8",desk:"M3 5h18v11H3z M9 20h6 M12 16v4",sleep:"M19 14.5A7.5 7.5 0 1 1 9.5 5a6 6 0 0 0 9.5 9.5z",restart:"M4 12a8 8 0 1 0 2.4-5.7 M4 4v4.5h4.5",off:"M12 3v8 M6.3 6.8a8 8 0 1 0 11.4 0",wifi:"M2.5 9a14 14 0 0 1 19 0 M5.5 12.5a9.5 9.5 0 0 1 13 0 M8.7 16a5 5 0 0 1 6.6 0 M12 19.5h.01",bt:"M7 7l10 10-5 4V3l5 4L7 17",pad:"M7 9h3 M8.5 7.5v3 M15 8.5h.01 M17 10.5h.01 M6.5 5h11a4 4 0 0 1 4 4.2l-.6 6.3a2.8 2.8 0 0 1-5 1.4L14.3 15H9.7l-1.6 1.9a2.8 2.8 0 0 1-5-1.4l-.6-6.3A4 4 0 0 1 6.5 5z",mouse:"M12 3a6 6 0 0 1 6 6v6a6 6 0 0 1-12 0V9a6 6 0 0 1 6-6z M12 7v3",air:"M10.5 4.5c0-1 .7-2 1.5-2s1.5 1 1.5 2v5l7 4v2l-7-2v4l2 1.5v1.5L12 20l-3.5 1v-1.5l2-1.5v-4l-7 2v-2l7-4z",dnd:"M19 14.5A7.5 7.5 0 1 1 9.5 5a6 6 0 0 0 9.5 9.5z M17 3v4 M15 5h4",rec:"M12 7a5 5 0 1 0 0 10a5 5 0 1 0 0-10z M12 2.5a9.5 9.5 0 1 0 0 19a9.5 9.5 0 1 0 0-19z",eye:"M12 4v1.5 M4.9 6.9l1 1 M19.1 6.9l-1 1 M3 13h2 M19 13h2 M7.5 17a4.5 4.5 0 1 1 9 0 M3 20h18",hdr:"M4 5h16v14H4z M7.5 9v6 M7.5 12h3 M10.5 9v6 M13.5 9h1.5a3 3 0 0 1 0 6h-1.5z",lib:"M5 4h4v16H5z M11 4h4v16h-4z M17 5l3 .6-2.6 14.4-3-.6",quit:"M7 7l10 10 M17 7L7 17",l:"M15 5l-7 7 7 7",r:"M9 5l7 7-7 7"};
const svg=(d,c="")=>`<svg class="${c}" viewBox="0 0 24 24"><path d="${d}"/></svg>`;
const S={open:true,game:true,f:"pw",pw:15,bri:70,vol:56,mute:false,armed:null,
 o:{fps:3,osd:0,fan:0,hz:0,scale:1,rumble:2}};
const PW={min:5,max:35,ticks:[8,15,25,35]};
const OPTS=[
 {id:"fps",nm:"帧率上限",v:["不限","30","40","60"],off:0},
 {id:"hz",nm:"刷新率",v:["120 Hz","60 Hz"]},
 {id:"scale",nm:"画面缩放",v:["关","Magpie","小黄鸭"],off:0,game:1},
 {id:"osd",nm:"性能显示",v:["关","简洁","标准","详细"],off:0},
 {id:"fan",nm:"风扇",v:["自动","静音","满速"]},
 {id:"rumble",nm:"震动",v:["关","弱","中","强"]}];
const ACTS={
 wifi:{nm:"Wi-Fi",d:P.wifi,tg:1,st:()=>TG.wifi?"Home-5G":"关"},bt:{nm:"蓝牙",d:P.bt,tg:1,st:()=>TG.bt?"已连接 2 个设备":"关"},air:{nm:"飞行模式",d:P.air,tg:1,st:()=>TG.air?"开":"关"},
 shot:{nm:"截图",d:P.shot,game:1,t:"已截图"},kbd:{nm:"键盘",d:P.kbd,t:"屏幕键盘"},pad:{nm:"手柄模式",d:P.pad,mode:1},
 pwr:{nm:"电源",d:P.off},desk:{nm:"桌面",d:P.desk,t:"切换到桌面"},vrr:{nm:"可变刷新率",txt:"VRR",tg:1,st:()=>TG.vrr?(S.game?"开 · 48–120 Hz":"开"):"关"},
 win:{nm:"窗口切换",d:P.win,t:"窗口切换",sub:()=>"3 个窗口"},lib:{nm:"游戏库",d:P.lib,t:"返回游戏库",sub:()=>"71 款"},
 quit:{nm:"退出游戏",d:P.quit,game:1,risk:"再按一次退出",warn:"未保存的进度会丢失",sub:()=>"鸣潮"},
 sleep:{nm:"睡眠",d:P.sleep,t:"睡眠"},restart:{nm:"重启",d:P.restart,risk:"再按一次"},off:{nm:"关机",d:P.off,risk:"再按一次关机",warn:"未保存的进度会丢失"}};
// 5 列 × 3 行；c/r/w = 列、行、跨列
// 左侧栏：镜像排布。九宫格在左（靠屏幕外沿），大卡片在右（靠画面）
const LAY=[["wifi",0,0],["bt",1,0],["air",2,0],["shot",0,1],["kbd",1,1],["pad",2,1],["pwr",0,2],["desk",1,2],["vrr",2,2],
 ["off",0,2],["restart",1,2],["sleep",2,2],["win",3,0,2,1],["lib",3,1,2,1],["quit",3,2,2,1]];

const TG={wifi:true,bt:true,air:false,vrr:true,pad:true};
function cellAt(r,c){for(const [id,cc,rr,w] of LAY){if(rr!=r)continue;if(r==2&&cc<3&&(S.pm?!PMSET.includes(id):!R2.includes(id)))continue;if(c>=cc&&c<cc+(w||1))return id}return null}
const $=id=>document.getElementById(id);

const W={on:true,cur:{id:"home5",ssid:"Home-5G",band:"5 GHz",sig:4,lock:1},
 list:[{id:"home24",ssid:"Home-2.4G",sig:3,lock:1,saved:1},{id:"cmcc",ssid:"CMCC-8F2A",sig:2,lock:1},{id:"free",ssid:"ChinaNet-Free",sig:2,lock:0},{id:"xm",ssid:"Xiaomi_Studio",sig:1,lock:1},{id:"hp",ssid:"DIRECT-7C-HP OfficeJet",sig:1,lock:1}]};
const B={on:true,paired:[{id:"xbox",name:"Xbox 无线控制器",t:"pad",conn:1,bat:80},{id:"pods",name:"AirPods Pro",t:"head",conn:0},{id:"k380",name:"罗技 K380",t:"kbd",conn:0}],
 found:[{id:"8bd",name:"8BitDo Ultimate",t:"pad"},{id:"sony",name:"Sony WH-1000XM5",t:"head",pin:"482 913"},{id:"buds",name:"Galaxy Buds2 Pro",t:"head"}]};
let pg=null,fi=0,items=[],armed=null,busy={},scan=false,shown={},open2=null,sheet=null;
// ---------- 打开 / 关闭 ----------
function openPage(k){pg=k;fi=0;armed=null;open2=null;scan=true;shown={};c.classList.add("away");np.classList.add("on");draw();
 const list=k=="wifi"?W.list:B.found;list.forEach((x,i)=>setTimeout(()=>{shown[x.id]=1;draw()},500+i*260));setTimeout(()=>{scan=false;draw()},500+list.length*260+600)}
function closePage(){if(sheet)return closeSheet();pg=null;np.classList.remove("on");c.classList.remove("away");TG.wifi=W.on;TG.bt=B.on;render()}
// ---------- 绘制 ----------
function row(it,i){const f=i==fi&&!sheet;return `<div class="li${f?" f":""}${armed==it.key?" arm":""}${it.dim?" dim":""}${it.isnew?" new":""}">${it.html}</div>`}
function draw(){items=[];let h="";const on=pg=="wifi"?W.on:B.on;
 h+=`<div class="hd">${ic(I.back,"bk")}<span class="ttl">${pg=="wifi"?"Wi-Fi":"蓝牙"}</span><span class="sw${on?" on":""}${fi==0&&!sheet?" f":""}"><i></i></span></div>`;items.push({key:"sw"});
 if(!on){h+=`<div class="sec">${pg=="wifi"?"Wi-Fi 已关闭":"蓝牙已关闭"}</div>`}
 else if(pg=="wifi"){
  if(W.cur){const k="cur";h+=`<div class="sec"><span>当前网络</span></div>`;items.push({key:k});
   h+=row({key:k,html:`<span class="ic">${bars(W.cur.sig)}</span><span class="nm"><span>${W.cur.ssid}</span></span><span class="st"><b>已连接</b> · ${W.cur.band}</span>`},items.length-1);
   h+=`<div class="acts2${open2=="cur"?" on":""}">${["断开","忘记"].map((t,j)=>{const key="cur:"+j;items.length;return `<span class="pb${open2=="cur"&&fi==items.length-1&&j==sub?" f":""}${armed==key?" arm":""}" data-k="${key}">${armed==key?"再按一次忘记":t}</span>`}).join("")}</div>`}
  h+=`<div class="sec"><span>其他网络</span>${scan?'<span class="spin"></span>':""}</div>`;
  const vis=W.list.filter(x=>shown[x.id]);if(!vis.length&&!scan)h+=`<div class="empty">附近没有可用的网络</div>`;
  vis.forEach(x=>{const k=x.id;items.push({key:k,x});const st=busy[k]?`<span class="spin"></span>正在连接`:x.saved?"已保存":"";
   h+=row({key:k,html:`<span class="ic">${bars(x.sig)}</span><span class="nm"><span>${x.ssid}</span></span><span class="st">${x.lock?ic(I.lock,"lk"):""}${st}</span>`},items.length-1)});
 } else {
  h+=`<div class="sec"><span>我的设备</span></div>`;
  B.paired.forEach(x=>{const k=x.id;items.push({key:k,x,paired:1});const st=busy[k]?`<span class="spin"></span>${x.conn?"正在断开":"正在连接"}`:x.conn?`<b>已连接</b>${x.bat?` · ${x.bat}%`:""}`:"未连接";
   h+=row({key:k,html:`<span class="ic">${ic(I[x.t])}</span><span class="nm"><span>${armed==k?"再按一次忘记":x.name}</span></span><span class="st">${st}</span>`},items.length-1)});
  h+=`<div class="sec"><span>可配对的设备</span>${scan?'<span class="spin"></span>':""}</div>`;
  const vis=B.found.filter(x=>shown[x.id]);if(!vis.length&&!scan)h+=`<div class="empty">没有找到新设备</div>`;
  vis.forEach(x=>{const k=x.id;items.push({key:k,x});const st=busy[k]?`<span class="spin"></span>正在配对`:"";
   h+=row({key:k,html:`<span class="ic">${ic(I[x.t])}</span><span class="nm"><span>${x.name}</span></span><span class="st">${st}</span>`},items.length-1)});
 }
 np.innerHTML=h;if(fi>=items.length)fi=items.length-1;
 // 当前网络的操作行：焦点在它上面时左右选
 if(open2=="cur"){np.querySelectorAll(".acts2 .pb").forEach((e,j)=>e.classList.toggle("f",j==sub&&!sheet))}}
let sub=0;
// ---------- 操作 ----------
function act(){const it=items[fi];if(!it)return;
 if(it.key=="sw"){if(pg=="wifi"){W.on=!W.on}else B.on=!B.on;fi=0;draw();return}
 if(pg=="wifi"){
  if(it.key=="cur"){if(open2!="cur"){open2="cur";sub=0;return draw()}
   if(sub==0){const old=W.cur;W.cur=null;open2=null;W.list.unshift({...old,saved:1});shown[old.id]=1;toast("已断开 "+old.ssid);return draw()}
   const key="cur:1";if(armed!=key){armed=key;return draw()}armed=null;const old=W.cur;W.cur=null;open2=null;W.list.unshift({...old,saved:0});shown[old.id]=1;toast("已忘记 "+old.ssid);return draw()}
  const x=it.x;if(busy[x.id])return;
  if(x.lock&&!x.saved)return openSheet({kind:"pw",x});
  connectWifi(x)}
 else{const x=it.x;if(busy[x.id])return;
  if(it.paired){busy[x.id]=1;draw();setTimeout(()=>{busy[x.id]=0;x.conn=x.conn?0:1;if(x.conn)x.bat=x.t=="head"?64:x.bat;draw()},900);return}
  if(x.pin)return openSheet({kind:"pin",x});
  pair(x)}}
function connectWifi(x){busy[x.id]=1;draw();setTimeout(()=>{busy[x.id]=0;const old=W.cur;W.list=W.list.filter(y=>y.id!=x.id);if(old){W.list.unshift({...old,saved:1});shown[old.id]=1}
 W.cur={...x,band:x.ssid.includes("5G")?"5 GHz":"2.4 GHz",saved:1};fi=1;draw();toast("已连接 "+x.ssid)},1300)}
function pair(x){busy[x.id]=1;draw();setTimeout(()=>{busy[x.id]=0;B.found=B.found.filter(y=>y.id!=x.id);B.paired.push({...x,conn:1,bat:x.t=="pad"?100:72});draw();toast("已配对 "+x.name)},1400)}
function forget(){const it=items[fi];if(!it)return;
 if(pg=="bt"&&it.paired){if(armed!=it.key){armed=it.key;return draw()}armed=null;B.paired=B.paired.filter(y=>y.id!=it.key);B.found.push({...it.x});shown[it.key]=1;toast("已忘记 "+it.x.name);return draw()}
 if(pg=="wifi"&&it.x&&it.x.saved){if(armed!=it.key){armed=it.key;return draw()}armed=null;it.x.saved=0;toast("已忘记 "+it.x.ssid);draw()}}
// ---------- 密码 / 配对码 ----------
let pw="",showPw=false,sf=0,err=false;
function openSheet(s){sheet=s;pw="";err=false;sf=s.kind=="pw"?0:1;drawSheet();sh.classList.add("on");draw()}
function closeSheet(){sheet=null;sh.classList.remove("on");draw()}
function drawSheet(){if(!sheet)return;const x=sheet.x;
 if(sheet.kind=="pw")sh.innerHTML=`<div class="t1">${x.ssid}</div><div class="t2">输入密码</div><div class="fld${sf==0?" f":""}">${pw?`<span>${showPw?pw:"•".repeat(pw.length)}</span>`:`<span class="ph">至少 8 位</span>`}${sf==0?'<span class="cur"></span>':""}<span class="eye">${ic(showPw?"M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z M12 9.5a2.5 2.5 0 1 0 0 5a2.5 2.5 0 1 0 0-5z":"M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z M4 4l16 16","ey")}</span></div><div class="err${err?" on":""}">密码不对，再试一次</div><div class="row2"><span class="pb${sf==1?" f":""}">取消</span><span class="pb${sf==2?" f":""}" style="${pw.length>=8?"":"opacity:.35"}">连接</span></div>`;
 else sh.innerHTML=`<div class="t1">与 ${x.name} 配对</div><div class="t2">确认对方显示的是同一组数字</div><div class="code">${x.pin}</div><div class="row2"><span class="pb${sf==1?" f":""}">取消</span><span class="pb${sf==2?" f":""}">配对</span></div>`}
function sheetKey(k,e){
 if(k=="Escape"||k=="Backspace"&&(sheet.kind!="pw"||sf!=0||!pw)){closeSheet();return}
 if(sheet.kind=="pw"&&sf==0){if(k=="Backspace"){pw=pw.slice(0,-1);err=false}else if(k.length==1&&k!=" "){pw+=k;err=false}else if(k=="ArrowDown"||k=="Enter")sf=2;else if(k=="x"||k=="X"){}drawSheet();if(k.length==1&&k!=" "||k=="Backspace")return}
 if(k=="ArrowUp"&&sheet.kind=="pw")sf=0;else if(k=="ArrowLeft")sf=1;else if(k=="ArrowRight")sf=2;else if(k=="ArrowDown"&&sf==0)sf=2;
 else if(k=="Enter"||k==" "){if(sf==1)return closeSheet();if(sf==2){const x=sheet.x;
  if(sheet.kind=="pw"){if(pw.length<8)return;if(pw=="12345678"){err=true;pw="";sf=0;return drawSheet()}closeSheet();x.saved=0;return connectWifi(x)}
  closeSheet();return pair(x)}}
 drawSheet()}
// ---------- 键盘 / 手柄 ----------
function onKey(k,e){
 if(sheet){if(k=="PadX"&&sheet.kind=="pw"){showPw=!showPw;return drawSheet()}return sheetKey(k,e)}
 if(k=="Escape"||k=="Backspace"){if(armed){armed=null;return draw()}if(open2){open2=null;return draw()}return closePage()}
 if(k=="ArrowDown"){if(fi<items.length-1){fi++;armed=null;if(items[fi].key!="cur")open2=null}return draw()}
 if(k=="ArrowUp"){if(fi>0){fi--;armed=null;if(items[fi].key!="cur")open2=null}return draw()}
 if(k=="ArrowLeft"||k=="ArrowRight"){if(open2=="cur"&&items[fi].key=="cur"){sub=k=="ArrowLeft"?0:1;armed=null;return draw()}if(k=="ArrowLeft")return closePage();return}
 if(k=="Enter"||k==" ")return act();
 if(k=="x"||k=="X"||k=="PadX")return forget()}
addEventListener("keydown",e=>{const k=e.key;
 if(!pg){if((k=="y"||k=="Y")&&S.open&&(S.f=="b:wifi"||S.f=="b:bt")){e.preventDefault();e.stopImmediatePropagation();openPage(S.f=="b:wifi"?"wifi":"bt")}return}
 if(k=="q"||k=="Q")return;
 // 原型手柄轮询合成的方向 / 确认 / 返回由下面包过的 move / press / back 处理，这里不重复
 if(!e.isTrusted&&["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Enter","Escape"].includes(k))return;
 e.preventDefault();e.stopImmediatePropagation();onKey(k,e)},true);
// 原型自己的手柄轮询发的按键和这个监听同在 window 上，谁先谁后不定：把它调用的 move / press / back 包一层，列表页开着时交给列表页
const _mv=move,_pr=press,_bk=back;
move=d=>pg?onKey({u:"ArrowUp",d:"ArrowDown",l:"ArrowLeft",r:"ArrowRight"}[d]):_mv(d);
press=()=>pg?onKey("Enter"):_pr();
back=()=>pg?onKey("Escape"):_bk();let prevY=false,prevX=false;(function pollY(){const g=[...(navigator.getGamepads?navigator.getGamepads():[])].find(x=>x);if(g){const y=g.buttons[3]&&g.buttons[3].pressed,x=g.buttons[2]&&g.buttons[2].pressed;
 if(y&&!prevY)dispatchEvent(new KeyboardEvent("keydown",{key:"y"}));if(x&&!prevX)dispatchEvent(new KeyboardEvent("keydown",{key:"PadX"}));prevY=y;prevX=x}requestAnimationFrame(pollY)})();
// 触控：长按 Wi-Fi / 蓝牙格进列表页；页里点行
["wifi","bt"].forEach(id=>{const e=document.querySelector(`[data-f="b:${id}"]`);let t;e.addEventListener("pointerdown",()=>{t=setTimeout(()=>{openPage(id)},450)});["pointerup","pointerleave"].forEach(ev=>e.addEventListener(ev,()=>clearTimeout(t)))});
np.addEventListener("click",ev=>{if(ev.target.closest(".hd")&&ev.clientX<np.getBoundingClientRect().left+80)return closePage();const rows=[...np.querySelectorAll(".hd .sw, .li")];const hit=ev.target.closest(".li,.sw");if(!hit)return;fi=rows.indexOf(hit);act()});
})();
</script>
</body></html>
