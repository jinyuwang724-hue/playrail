<style>
:root{
  --bg:#0F0F10; --fg:#F2F2F2; --fg2:rgba(242,242,242,.6); --fg3:rgba(242,242,242,.34);
  --chip:rgba(255,255,255,.14); --ring:#FFFFFF;
  --sans:"SF Pro Display","SF Pro Text","PingFang SC","Noto Sans SC",system-ui,sans-serif;
  --quart:cubic-bezier(.165,.84,.44,1);
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden}
body{padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));font-family:var(--sans)}
#vp{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#050505}
#stage{width:1920px;height:1200px;position:relative;overflow:hidden;background:var(--bg);transform-origin:center;flex:none;user-select:none;-webkit-user-select:none;touch-action:none}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
img{max-width:none;display:block;-webkit-user-drag:none}
.hide-sb{scrollbar-width:none}.hide-sb::-webkit-scrollbar{display:none}
.f{outline:3px solid transparent;outline-offset:5px;transition:outline-color .14s}
.f.fo{outline-color:var(--ring)}

.hdr{position:absolute;left:0;right:0;top:0;height:112px;padding:0 96px;display:flex;align-items:center;justify-content:space-between;z-index:20;pointer-events:none;transition:opacity .3s}
.hdr>*{pointer-events:auto}
.hdr .l{display:flex;align-items:baseline;gap:40px}
.hdr h1{margin:0;font-size:24px;font-weight:600}
.tabs{display:flex;gap:30px}
.tab{font-size:20px;color:var(--fg2);padding:8px 0;position:relative;display:flex;gap:8px;align-items:baseline}
.tab small{font-size:15px;color:var(--fg3);font-variant-numeric:tabular-nums}
.tab.on{color:var(--fg)}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:2px;background:var(--fg)}
.st{display:flex;align-items:center;gap:22px;font-size:20px;font-variant-numeric:tabular-nums}
.st span{display:flex;align-items:center;gap:8px}
.st .snd{width:48px;height:48px;border-radius:24px;justify-content:center;color:var(--fg2)}

#views{position:absolute;inset:0;z-index:0}
.view{position:absolute;inset:0}
.pill{height:64px;padding:0 34px;border-radius:32px;background:var(--chip);font-size:20px;font-weight:600;display:flex;align-items:center;gap:12px;flex:none}
.pill.pri{background:#F2F2F2;color:#111}
.ib{width:64px;height:64px;border-radius:32px;background:var(--chip);display:flex;align-items:center;justify-content:center;flex:none}
.ib.on{background:#F2F2F2;color:#111}
.acts{display:flex;gap:16px}
.meta{font-size:20px;color:var(--fg2);font-variant-numeric:tabular-nums;white-space:nowrap}
h2.t{margin:0;font-size:64px;font-weight:600;line-height:1.1;letter-spacing:.01em;text-wrap:balance}

/* background: the game's art, full width (from the previous C1) */
.bgw{position:absolute;inset:0;overflow:hidden}
.bgw img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;transition:opacity .4s ease}
.bgw::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(15,15,16,.86) 0,rgba(15,15,16,.4) 42%,rgba(15,15,16,0) 68%),linear-gradient(to bottom,rgba(15,15,16,.55) 0,rgba(15,15,16,0) 18%,rgba(15,15,16,0) 46%,rgba(15,15,16,.92) 82%,#0F0F10)}
#v1 .bgw::after,#v3 .bgw::after{background:linear-gradient(90deg,rgba(15,15,16,.9) 0,rgba(15,15,16,.55) 38%,rgba(15,15,16,.15) 70%,rgba(15,15,16,.35) 100%),linear-gradient(to bottom,rgba(15,15,16,.55) 0,rgba(15,15,16,0) 18%,rgba(15,15,16,0) 60%,rgba(15,15,16,.85) 100%)}

/* game-case paint (Finally 3D Game Cases) */
.case{position:absolute;inset:0;border-radius:6px;overflow:hidden;background:var(--b)}
.case img{width:100%;height:100%;object-fit:cover}
.case::after{content:"";position:absolute;inset:0;border-radius:6px;pointer-events:none;
  background:linear-gradient(180deg,var(--a) 0,var(--a) 4.6%,rgba(0,0,0,.35) 4.6%,rgba(0,0,0,.35) calc(4.6% + 1px),transparent calc(4.6% + 1px)),
  linear-gradient(112deg,rgba(255,255,255,.32) 0%,rgba(255,255,255,.08) 15%,rgba(255,255,255,0) 32%,rgba(255,255,255,0) 60%,rgba(255,255,255,.1) 72%,rgba(255,255,255,0) 73.5%),
  linear-gradient(90deg,transparent 3.2%,rgba(255,255,255,.3) 3.2%,rgba(255,255,255,.3) 3.9%,rgba(0,0,0,.28) 3.9%,rgba(0,0,0,.28) 5%,rgba(255,255,255,.05) 5%,transparent 9%),
  linear-gradient(90deg,rgba(0,0,0,.42) 0,rgba(255,255,255,.2) 1.5%,rgba(0,0,0,.16) 3.2%,rgba(0,0,0,0) 7.5%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),inset 0 0 0 3px rgba(0,0,0,.18),inset 0 0 0 4px rgba(255,255,255,.08)}
.case .sh{position:absolute;inset:0;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.5) 50%,transparent 62%) 160% 0/260% 100% no-repeat;pointer-events:none}
.sel .case .sh{animation:shine 1s ease-out .2s 1 both}
@keyframes shine{from{background-position:160% 0}to{background-position:-60% 0}}
.allc{position:absolute;inset:0;border-radius:6px;background:#232326;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--fg2);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
.sel .allc{color:var(--fg);background:#2c2c30}

/* ---- C1 卡盒箱 (cratedigger) ---- */
#v1 .info{position:absolute;left:96px;top:0;bottom:0;width:640px;display:flex;flex-direction:column;justify-content:center;gap:14px}
#v1 .info .acts,#v3 .info .acts{margin-top:30px}
.crate{position:absolute;left:760px;right:0;top:112px;bottom:0;perspective:1400px;perspective-origin:50% -45%}
.cr3{position:absolute;inset:0;transform-style:preserve-3d}
.ck{position:absolute;left:calc(50% - 170px);bottom:250px;width:340px;height:510px;transform-origin:50% 100%;transform-style:preserve-3d;
  transition:transform 1s var(--quart),opacity .5s ease;box-shadow:0 -6px 22px rgba(0,0,0,.45)}
.ck .top{position:absolute;left:0;right:0;top:0;height:22px;transform-origin:center top;transform:rotateX(-90deg);background:linear-gradient(0deg,var(--b),var(--a))}
.wall{position:absolute;left:calc(50% - 300px);width:600px;bottom:-20px;height:380px;border-radius:10px 10px 4px 4px;z-index:3;pointer-events:none;
  background:linear-gradient(180deg,#2a2a2e 0,#19191b 18%,#141416 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.14),inset 0 0 0 1px rgba(255,255,255,.06),0 40px 60px rgba(0,0,0,.6)}
.wall::before{content:"";position:absolute;left:50%;top:44px;width:120px;height:14px;margin-left:-60px;border-radius:7px;background:#0b0b0c;box-shadow:inset 0 2px 3px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.08)}
.wall b{position:absolute;left:0;right:0;bottom:150px;text-align:center;font-size:20px;font-weight:600;color:var(--fg3);font-variant-numeric:tabular-nums;letter-spacing:.08em}
.floor{position:absolute;left:calc(50% - 380px);width:760px;bottom:70px;height:80px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.65),transparent);z-index:1}

/* ---- C2 卡盒架 (Selene-style larger selected cover) ---- */
#v2 .info{position:absolute;left:96px;right:96px;bottom:562px;display:flex;flex-direction:column;align-items:flex-start;gap:22px}
#v2 .info .tx{min-width:0;max-width:100%;display:flex;flex-direction:column;gap:10px}
#v2 h2.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{position:absolute;left:0;right:0;bottom:64px;height:470px}
.rail{position:absolute;left:0;bottom:0;display:flex;align-items:flex-end;gap:28px;transition:transform .55s var(--quart)}
.it{position:relative;flex:none;width:228px;height:342px;transition:width .55s var(--quart),height .55s var(--quart)}
.it .wrap{position:absolute;inset:0;transition:transform .55s var(--quart),filter .4s,box-shadow .55s;border-radius:6px;box-shadow:0 10px 18px rgba(0,0,0,.45);filter:brightness(.78)}
.it.sel{width:308px;height:462px}
.it.sel .wrap{filter:none;transform:translateY(-8px);box-shadow:0 26px 50px -8px rgba(0,0,0,.7),0 0 0 3px #fff,0 18px 60px -10px var(--a)}
.glab{position:absolute;left:0;top:-36px;font-size:15px;color:var(--fg2);white-space:nowrap;transition:opacity .3s}
.it.sel .glab{opacity:0}

/* ---- C3 叠放 (CollectionViewPagingLayout stack) ---- */
#v3 .info{position:absolute;left:96px;top:0;bottom:0;width:640px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.pile{position:absolute;left:0;top:0;width:1920px;height:1200px;pointer-events:none}
.sc{position:absolute;left:920px;top:300px;width:420px;height:630px;transition:transform .6s var(--quart),opacity .6s var(--quart);pointer-events:auto;will-change:transform}
.sc .wrap{position:absolute;inset:0;border-radius:6px;box-shadow:0 2px 5px rgba(0,0,0,.35),0 24px 40px -12px rgba(0,0,0,.6)}
.sc .dim{position:absolute;inset:0;border-radius:6px;background:#000;opacity:var(--dim,0);transition:opacity .6s var(--quart);pointer-events:none}

/* ---- 全部 ---- */
.amb{position:absolute;left:-60px;right:-60px;top:-60px;height:900px;pointer-events:none}
.amb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(36px);opacity:0;transition:opacity .5s}
.amb img.on{opacity:.4}
.amb::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(15,15,16,.15),var(--bg) 92%)}
.ascroll{position:absolute;top:112px;bottom:0;left:0;right:0;overflow-y:auto;padding:16px 0 120px;touch-action:pan-y}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:48px 32px;padding:8px 96px 0}
.sec{position:relative;padding:0 96px;font-size:24px;font-weight:600;display:flex;gap:12px;align-items:baseline;margin:16px 0 22px}
.sec small{font-size:17px;color:var(--fg3);font-weight:400;font-variant-numeric:tabular-nums}
.rrow{position:relative;display:flex;gap:24px;overflow-x:auto;padding:8px 96px 16px;touch-action:pan-x}
.rcard{flex:none;width:452px;text-align:left}
.rrow{padding:14px 96px 18px}
/* loose cartridge */
.rcard{width:400px}
.cg{position:relative;width:400px;height:300px;border-radius:12px 12px 10px 10px;clip-path:polygon(0 0,88% 0,100% 9%,100% 100%,0 100%);
  background:linear-gradient(180deg,#34343a,#232327 60%,#1d1d21);transition:transform .45s var(--quart),filter .45s var(--quart);filter:drop-shadow(0 14px 16px rgba(0,0,0,.55))}
.cg::before{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 0 0 1px rgba(255,255,255,.07);background:linear-gradient(120deg,rgba(255,255,255,.12),rgba(255,255,255,0) 38%)}
.cg .grip{position:absolute;left:20px;right:72px;top:12px;height:16px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 2px,transparent 2px 9px);border-radius:2px}
.cg .lab{position:absolute;left:16px;right:16px;top:38px;height:186px;border-radius:6px;background-size:cover;background-color:var(--b);box-shadow:0 0 0 1px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.14)}
.cg .lab::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,rgba(255,255,255,.22),rgba(255,255,255,0) 32%)}
.cg .stripe{position:absolute;left:16px;width:120px;top:236px;height:6px;border-radius:3px;background:var(--a)}
.cg .pins{position:absolute;left:40px;right:40px;bottom:0;height:30px;border-radius:4px 4px 0 0;background:#141416;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.cg .pins::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:18px;background:repeating-linear-gradient(90deg,#e0bf55 0 4px,#8a6d1c 4px 5px,transparent 5px 10px)}
.cg.fo{transform:translateY(-10px) rotate(-1.2deg);filter:drop-shadow(0 26px 22px rgba(0,0,0,.6)) drop-shadow(0 10px 40px var(--a))}
.cg.f{outline:none}
.cg.fo::before{box-shadow:inset 0 0 0 3px #fff}
/* grid cases */
.grid button{text-align:left;min-width:0}
.gc{position:relative;width:100%;aspect-ratio:2/3;border-radius:6px;transition:transform .4s var(--quart),box-shadow .4s var(--quart);box-shadow:0 10px 18px -6px rgba(0,0,0,.55)}
.gc.fo{transform:translateY(-8px);box-shadow:0 26px 44px -10px rgba(0,0,0,.75),0 16px 50px -16px var(--a)}
.gc.fo .case .sh{animation:shine 1s ease-out .1s 1 both}
.cap{margin-top:12px;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap2{margin-top:4px;font-size:15px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---- launch ---- */
#run{position:absolute;inset:0;z-index:30;pointer-events:none}
#run.on{pointer-events:auto}
.bx{position:absolute;box-sizing:border-box}
.lscr{position:absolute;inset:0;opacity:0;background:#000;z-index:5}
.lscr img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lscr::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.2),transparent 35%,rgba(0,0,0,.85))}
.ltxt{position:absolute;left:96px;bottom:110px;z-index:2}
.ltxt h2{margin:0 0 14px;font-size:64px;font-weight:600}
.lbar{margin-top:18px;width:360px;height:3px;border-radius:2px;background:rgba(255,255,255,.22);overflow:hidden}
.lbar i{display:block;width:30%;height:100%;background:#fff;animation:run 1.1s ease-in-out infinite}
@keyframes run{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}

#sw{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(30,30,32,.92);border:1px solid rgba(255,255,255,.1);z-index:50;font-size:13px}
#sw button{padding:8px 14px;border-radius:999px;color:var(--fg2);white-space:nowrap}
#sw button.on{background:#F2F2F2;color:#111}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const ST={scaleFactor:.08,minScale:.2,maxStackSize:6,spacingFactor:.2,perspectiveRatio:.15,popAngle:Math.PI/10,popW:-1.45,popH:.3,topAlphaSpeed:.1,bottomAlphaSpeed:10,posX:1,posY:0};

const easeOut=x=>1-(1-x)*(1-x);
const lerpIn=(v,a,b)=>Math.min(1,Math.max(0,(v-a)/(b-a)));
function lay3(){
  const items=[...document.querySelectorAll("#items .sc")],s=S.idx,W=420,H=630;
  items.forEach((el,i)=>{let p=Math.max(-1,i-s);
    let scale=Math.max(ST.minScale,1-Math.max(0,p)*ST.scaleFactor);
    const pp=easeOut(lerpIn(p,0,ST.maxStackSize))*ST.perspectiveRatio;
    const tx=W*ST.spacingFactor*Math.max(p,0)*ST.posX, ty=H*ST.spacingFactor*Math.max(p,0)*ST.posY;
    let xa=(((scale-1)*W)/2+pp*W)*-ST.posX, ya=(((scale-1)*H)/2+pp*H)*-ST.posY;
    if(p<0){xa-=W*ST.popW*p;ya-=H*ST.popH*p}
    let ang=0;if(p<0)ang=-Math.abs(p)*ST.popAngle;
    else{ang=(i%2?1:-1)*Math.min(p,1)*0.035}                          /* ours: a slightly uneven pile */
    let a=1;const n=ST.maxStackSize;if(p>=n-1)a=1-lerpIn(p,n-1,n-1+ST.bottomAlphaSpeed)*10;if(p<0)a=0;
    a=Math.max(0,Math.min(1,a));if(i-s>n)a=0;
    el.style.transform=`translate(${tx+xa}px,${ty+ya}px) scale(${scale}) rotate(${ang}rad)`;
    el.style.opacity=a;el.style.zIndex=200-(i-s);el.style.setProperty("--dim",p>0?Math.min(.55,p*.11):0);
    el.style.pointerEvents=a>0?"":"none";el.classList.toggle("sel",p===0&&i===s)});
}
